substitutions:
  name: ble-scanner
  device_description: "Search for BLE devices"

esphome:
  name: ${name}
  friendly_name: ${name}
  comment: ${device_description}
  min_version: "2026.1.0"
  project:
    name: "syssi.esphome-jk-bms"
    version: 3.0.0

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

ota:
  platform: esphome

logger:
  level: DEBUG
  logs:
    wifi: WARN

api:
  reboot_timeout: 0s

esp32_ble_tracker:
  scan_parameters:
    active: true
  on_ble_advertise:
    then:
      - lambda: |-
          static const auto JK_SERVICE_UUID = esp32_ble::ESPBTUUID::from_uint16(0xFFE0);
          static const auto JK_COMPANY_ID = esp32_ble::ESPBTUUID::from_uint16(0x0B65);

          const auto &service_uuids = x.get_service_uuids();
          if (std::find(service_uuids.begin(), service_uuids.end(), JK_SERVICE_UUID) == service_uuids.end())
            return;

          const auto &manufacturer_datas = x.get_manufacturer_datas();
          if (std::none_of(manufacturer_datas.begin(), manufacturer_datas.end(),
                           [](const auto &md) { return md.uuid == JK_COMPANY_ID; }))
            return;

          const std::string name = x.get_name();
          char addr_buf[MAC_ADDRESS_PRETTY_BUFFER_SIZE];
          ESP_LOGI("ble_adv", "JK-BMS found");
          ESP_LOGI("ble_adv", "  Name: %s", name.c_str());
          ESP_LOGI("ble_adv", "  MAC address: %s", x.address_str_to(addr_buf));
          ESP_LOGI("ble_adv", "  RSSI: %d dBm", x.get_rssi());
          char uuidstr[esphome::esp32_ble::UUID_STR_LEN];
          for (const auto &md : manufacturer_datas) {
            char hex_buf[format_hex_pretty_size(31)];
            ESP_LOGI("ble_adv", "  Manufacturer data (%s): %s", md.uuid.to_str(uuidstr),
                     format_hex_pretty_to(hex_buf, md.data.data(), md.data.size(), '.'));
          }
          ESP_LOGD("ble_adv", "  Advertised service UUIDs:");
          for (const auto &uuid : service_uuids) {
            ESP_LOGD("ble_adv", "    - %s", uuid.to_str(uuidstr));
          }

text_sensor:
  - platform: ble_scanner
    name: "BLE Devices Scanner"
